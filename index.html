    function getSupabaseHeaders(extra = {}) {
      const headers = {
        apikey: SUPABASE_ANON_KEY,
        ...extra
      };
      if (SUPABASE_ANON_KEY.startsWith('eyJ')) {
        headers.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
      }
      return headers;
    }

    function showDbError(msg) {
      const form = document.getElementById('donation-form');
      let errBox = document.getElementById('supabase-error-box');
      if (!errBox) {
        errBox = document.createElement('div');
        errBox.id = 'supabase-error-box';
        errBox.className = 'mb-4 p-3 rounded-xl bg-red-50 border border-red-300 text-red-800 text-xs break-words';
        form.parentNode.insertBefore(errBox, form);
      }
      errBox.innerHTML = `<strong>Supabase Error:</strong> ${escapeHtml(msg)}`;
    }

    function clearDbError() {
      const errBox = document.getElementById('supabase-error-box');
      if (errBox) errBox.remove();
    }

    function applyLanguage() {
      const dict = i18n[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById('lang-btn-label').textContent = currentLang === 'en' ? 'తెలుగు' : 'English';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.setAttribute('placeholder', dict[key]);
      });

      renderRegister();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'te' : 'en';
      localStorage.setItem(LANG_KEY, currentLang);
      applyLanguage();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function maskPhone(phone) {
      if (!phone) return '—';
      const digits = phone.replace(/\D/g, '');
      if (digits.length >= 10) {
        return digits.slice(0, 2) + 'XXXXXX' + digits.slice(-2);
      }
      return phone;
    }

    function selectPresetAmount(val) {
      document.getElementById('amount').value = val;
    }

    function selectPaymentMode(mode) {
      document.getElementById('paymentMode').value = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        if (btn.getAttribute('data-mode') === mode) {
          btn.className = 'mode-btn py-2 px-3 rounded-xl border-2 border-forest-800 bg-forest-800 text-white text-xs sm:text-sm font-semibold transition';
        } else {
          btn.className = 'mode-btn py-2 px-3 rounded-xl border border-stone-300 bg-white text-stone-700 hover:bg-stone-50 text-xs sm:text-sm font-semibold transition';
        }
      });
    }

    function handleScreenshotSelect(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast(i18n[currentLang].toastImgError);
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const MAX_DIM = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_DIM) {
            height = Math.round((height * MAX_DIM) / width);
            width = MAX_DIM;
          } else if (height > MAX_DIM) {
            width = Math.round((width * MAX_DIM) / height);
            height = MAX_DIM;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          pendingScreenshotDataUrl = canvas.toDataURL('image/jpeg', 0.65);
          document.getElementById('screenshot-preview-img').src = pendingScreenshotDataUrl;
          document.getElementById('screenshot-file-name').textContent = file.name;
          document.getElementById('screenshot-preview-box').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearScreenshot() {
      pendingScreenshotDataUrl = '';
      document.getElementById('paymentScreenshot').value = '';
      document.getElementById('screenshot-preview-img').src = '';
      document.getElementById('screenshot-preview-box').classList.add('hidden');
    }

    function openScreenshotModal(id) {
      const item = donations.find(d => String(d.id) === String(id));
      if (!item || !item.screenshot_url) return;
      document.getElementById('modal-donor-name').textContent = item.member_name;
      document.getElementById('modal-donor-meta').textContent = `₹${Number(item.amount).toLocaleString('en-IN')} • ${item.payment_mode}${item.reference_note ? ' • ' + item.reference_note : ''}`;
      document.getElementById('modal-screenshot-img').src = item.screenshot_url;
      document.getElementById('screenshot-modal').classList.remove('hidden');
    }

    function closeScreenshotModal() {
      document.getElementById('screenshot-modal').classList.add('hidden');
      document.getElementById('modal-screenshot-img').src = '';
    }

    async function loadDonations() {
      const badge = document.getElementById('db-status-badge');
      const baseUrl = SUPABASE_REST_URL.replace(/\/+$/, '');

      try {
        const res = await fetch(`${baseUrl}/${SUPABASE_TABLE}?select=*&order=created_at.desc`, {
          headers: getSupabaseHeaders()
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        donations = await res.json();
        clearDbError();
        badge.textContent = 'Supabase Live';
        badge.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200';
        renderRegister();
      } catch (err) {
        console.error('Supabase fetch error:', err);
        badge.textContent = 'Supabase Error';
        badge.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-red-50 text-red-800 border border-red-200';
        showDbError(err.message);
        renderRegister();
      }
    }

    async function handleDonationSubmit(e) {
      e.preventDefault();
      const amount = Number(document.getElementById('amount').value);
      const member_name = document.getElementById('memberName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const payment_mode = document.getElementById('paymentMode').value;
      const reference_note = document.getElementById('referenceNote').value.trim();
      const screenshot_url = pendingScreenshotDataUrl || '';

      if (!amount || amount <= 0 || !member_name) return;

      const baseUrl = SUPABASE_REST_URL.replace(/\/+$/, '');
      const newEntry = {
        member_name,
        phone,
        amount,
        payment_mode,
        reference_note,
        screenshot_url
      };

      try {
        const res = await fetch(`${baseUrl}/${SUPABASE_TABLE}`, {
          method: 'POST',
          headers: getSupabaseHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(newEntry)
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Insert failed (HTTP ${res.status}): ${errText}`);
        }
        const inserted = await res.json();
        clearDbError();
        donations.unshift(inserted[0] || { ...newEntry, id: Date.now().toString(), created_at: new Date().toISOString() });
        document.getElementById('donation-form').reset();
        clearScreenshot();
        selectPaymentMode('UPI');
        renderRegister();
        showToast(i18n[currentLang].toastSaved);
      } catch (err) {
        console.error('Supabase insert error:', err);
        showDbError(err.message);
      }
    }

    async function deleteEntry(id) {
      if (!confirm(i18n[currentLang].confirmDelete)) return;

      const baseUrl = SUPABASE_REST_URL.replace(/\/+$/, '');
      try {
        const res = await fetch(`${baseUrl}/${SUPABASE_TABLE}?id=eq.${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: getSupabaseHeaders()
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Delete failed (HTTP ${res.status}): ${errText}`);
        }
        donations = donations.filter(item => String(item.id) !== String(id));
        renderRegister();
        showToast(i18n[currentLang].toastDeleted);
      } catch (err) {
        console.error('Supabase delete error:', err);
        showDbError(err.message);
      }
    }

          <div class="text-right shrink-0 flex items-center gap-2">
            <span class="font-bold text-forest-900 text-base">₹${Number(item.amount).toLocaleString('en-IN')}</span>
            <button onclick="deleteEntry('${item.id}')" class="text-stone-400 hover:text-red-600 p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function copyWhatsAppSummary() {
      const total = donations.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const header = currentLang === 'te'
        ? `*కమ్మ సంఘం (Reg No - 973/2025)*\n*కార్తీకమాస వనభోజనాలు — విరాళాల జాబితా*\n\n`
        : `*Kamma Sangham (Reg No - 973/2025)*\n*Karthikamasam Vanabhojanalu — Group Donation Register*\n\n`;

      const lines = donations.map((item, i) =>
        `${i + 1}. ${item.member_name} — *₹${Number(item.amount).toLocaleString('en-IN')}* (${item.payment_mode})`
      ).join('\n');

      const footer = currentLang === 'te'
        ? `\n\n*మొత్తం దాతలు:* ${donations.length}\n*గ్రూప్‌లో మొత్తం వసూలు:* ₹${total.toLocaleString('en-IN')}`
        : `\n\n*Total Contributors:* ${donations.length}\n*Total Collected in Group:* ₹${total.toLocaleString('en-IN')}`;

      navigator.clipboard.writeText(header + lines + footer).then(() => {
        showToast(i18n[currentLang].toastWhatsApp);
      });
    }

    function exportToCSV() {
      const headers = ['S.No', 'Contributor Name', 'Phone', 'Amount (INR)', 'Payment Mode', 'Reference Note', 'Screenshot Attached', 'Recorded At'];
      const rows = donations.map((item, idx) => [
        idx + 1,
        `"${(item.member_name || '').replace(/"/g, '""')}"`,
        `"${(item.phone || '').replace(/"/g, '""')}"`,
        item.amount,
        `"${(item.payment_mode || '').replace(/"/g, '""')}"`,
        `"${(item.reference_note || '').replace(/"/g, '""')}"`,
        item.screenshot_url ? 'Yes' : 'No',
        `"${item.created_at || ''}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `kamma-sangham-vanabhojanalu-${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast(i18n[currentLang].toastCsv);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage();
      loadDonations();
    });
  </script>
